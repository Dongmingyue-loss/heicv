<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body{width:300px;margin:0;font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#111}
  @media (prefers-color-scheme:dark){body{background:#0d1117;color:#e6edf3}}
  .hd{padding:14px 16px 10px;display:flex;align-items:center;gap:8px}
  .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#2d7ff9,#7b5cf0)}
  .name{font-weight:600;font-size:14px}
  .ver{margin-left:auto;font-size:11px;opacity:.45}
  .body{padding:0 16px 14px}
  .desc{font-size:12px;line-height:1.55;opacity:.7;margin:0 0 12px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;box-sizing:border-box;
       padding:9px 12px;border:0;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
       background:#2d7ff9;color:#fff;transition:.15s}
  .btn:hover{background:#1f6fe0}
  .btn.sec{background:transparent;color:inherit;border:1px solid rgba(128,128,128,.35)}
  .btn.sec:hover{background:rgba(128,128,128,.1)}
  .btn+.btn{margin-top:7px}
  .tip{margin-top:11px;padding:8px 10px;border-radius:7px;font-size:11px;line-height:1.5;
       background:rgba(45,127,249,.09);color:#2d7ff9}
  .ft{padding:9px 16px;border-top:1px solid rgba(128,128,128,.18);font-size:11px;opacity:.5;text-align:center}
  .ft a{color:inherit;text-decoration:none}
  .ft a:hover{text-decoration:underline}
</style></head>
<body>
  <div class="hd">
    <div class="logo"></div>
    <div class="name">HEICV</div>
    <div class="ver" id="ver"></div>
  </div>

  <div class="body">
    <p class="desc" data-i18n="popup_desc">Convert HEIC photos and Live Photos to JPG, PNG, GIF or MP4 — batch, in your browser.</p>

    <button class="btn" id="open" data-i18n="popup_open">Open Converter</button>
    <button class="btn sec" id="pick" data-i18n="popup_pick">Select Files…</button>

    <div class="tip" data-i18n="popup_tip">
      All processing runs locally in your browser. Files are never uploaded.
    </div>
  </div>

  <div class="ft">
    <a href="https://heicv.pages.dev/" target="_blank" data-i18n="popup_site">heicv.pages.dev</a>
  </div>

  <script src="popup.js"></script>
</body></html>
